name: superfcm_flutter
description: SuperFCM is the missing frontend to Firebase Cloud Messaging. This package wraps the Firebase Messaging SDK and allows you to integrate with the SuperFCM platform.
version: 0.1.0
homepage: https://superfcm.com
repository: https://github.com/superfcm/superfcm-flutter-sdk
topics:
  - fcm
  - push-notifications
  - firebase
  - superfcm

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  device_info_plus: ^11.3.0
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_timezone: ^4.1.0
  http: ^1.2.2
  internet_connection_checker_plus: ^2.7.0
  intl: ^0.20.2
  ipapi: ^2.0.0
  json_annotation: ^4.9.0
  package_info_plus: ^8.2.1
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.2.2
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
